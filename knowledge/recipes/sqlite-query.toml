explain = "`தளம்_இணை` borrows a connection from a process-wide cache. Queries are parameterised — the values go in an array, never into the string — and rows come back as an array of records."
code = '''
தளம்_இணை "sqlite", "kaNakku.db";

தளம்_வினா "SELECT peyar, qokY FROM pativukaL WHERE vakY = ?",
          ["வரவு"], வரவுகள்;

ஒவ்வொரு பதிவு இல் வரவுகள் {
    அச்சு பதிவு.peyar;
}
'''
