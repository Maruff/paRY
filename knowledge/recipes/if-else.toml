explain = "The condition is parenthesised and `எனில்` follows it. `இன்றேல்` is the other branch. There is no `else if` keyword — nest, or return early."
code = '''
வருவாய் = 950000;

(வருவாய் > 800000) எனில் {
    அச்சு "High tax bracket";
    அச்சு (வருவாய் - 800000) * 20%;
}
இன்றேல் {
    அச்சு "Low tax bracket";
}
'''
