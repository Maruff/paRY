# Deliberately conservative, and not resolved on the machine that wrote them —
# there is no JDK, Gradle or Android SDK there. These are combinations known to
# work together rather than the newest of each; Android Studio's upgrade
# assistant is the right way to move them. Bump targetSdk to whatever Play
# currently requires before publishing.
[versions]
agp = "8.7.3"
kotlin = "2.0.21"
appcompat = "1.7.0"
activity = "1.9.3"
coreKtx = "1.13.1"

[libraries]
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
