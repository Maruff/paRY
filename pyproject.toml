[project]
name = "paRY"
version = "0.1.0"
description = "பறை — a code assistant for eTamil, trained on infrastructure the project controls"
requires-python = ">=3.12"
dependencies = [
    "tokenizers>=0.21",
]

[project.optional-dependencies]
serve = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
dev = ["pytest>=8", "fastapi>=0.115", "uvicorn[standard]>=0.32", "httpx2>=0.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "paRY",
    "paRY.answer",
    "paRY.corpus",
    "paRY.eval",
    "paRY.index",
    "paRY.serve",
    "paRY.tokenizer",
    "paRY.verify",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
