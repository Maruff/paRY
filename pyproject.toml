[project]
name = "paRY"
version = "0.1.0"
description = "பறை — a code assistant for eTamil, trained on infrastructure the project controls"
requires-python = ">=3.12"
dependencies = [
    "tokenizers>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["paRY", "paRY.corpus", "paRY.tokenizer", "paRY.verify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
